name: Singularity Build
on: workflow_call


jobs:
  run_conversion:
    name: "Pull docker image and convert"
    runs-on: ubuntu-latest

    container:
      image: quay.io/singularity/singularity:v3.8.1
      options: --privileged

    steps:
      - name: "Pull image"
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          singularity pull --name rfam-rfam-families-${TAG}.sif docker://rfam/family-pipeline:${TAG}
      - name: "Push to ghcr"
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u ${{ github.actor }} --password-stdin oras://ghcr.io
          singularity push rfam-rfam-families-${TAG}.sif oras://ghcr.io/${GITHUB_REPOSITORY}:${TAG}
