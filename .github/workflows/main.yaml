name: Building Pipeline Containers

on:
 push:
  branches:
   'master'
jobs:

  starting-notification:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v2

     - name: Intital notification
       uses: rtCamp/action-slack-notify@v2
       env:
         SLACK_MESSAGE: 'Creating new rfam-family-pipeline image (commit ${{ github.sha }})'
         SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
         MSG_MINIMAL: true

  create-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

      - name: docker build
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build -f Dockerfile -t rfam/family-pipeline:${TAG} .
          docker tag rfam/family-pipeline:${TAG} rfam/family-pipeline:master

      - name: docker push
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker push rfam/family-pipeline:${TAG}
          docker push rfam/family-pipeline:master

  finished-notification:
    needs:
      - create-docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Finished notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_MESSAGE: 'New rfam-family-pipeline image pushed to docker hub (commit ${{ github.sha }})'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG_MINIMAL: true

  singularity-conversion:
    needs:
      - create-docker-image
    uses: rfam/rfam-family-pipeline/.github/workflows/singularity.yaml@master
    secrets: inherit


  finished-singularity:
    needs:
      - singularity-conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Finished notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_MESSAGE: 'New singularity image pushed to ghcr (commit ${{ github.sha }})'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG_MINIMAL: true
