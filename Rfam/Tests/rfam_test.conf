location ""

<svn>
  svnNewFamilies    trunk/FamiliesPending
  svnFamilies       trunk/Families
  svnNewClans       trunk/ClansPending
  svnClans          trunk/Clans
  svnRevision       HEAD
  svnRepos          https://svn.rfam.org/svn/data_repos/
</svn>

<binaries>
  infernal     /opt/pixi/envs/infernal/bin/
  easel        /opt/pixi/envs/infernal/bin/
  binLocation  /opt/pixi/envs/infernal/bin/
</binaries>

<seqdb>
  <rfamseq>
    dbSize            500000.0
    dbPath            /Rfam/rfam-family-pipeline/Rfam/Tests/data/rfamseq.test.fa.gz
    fetchPath         /Rfam/rfam-family-pipeline/Rfam/Tests/data/rfamseq.test.fa.gz
    searchPathPrefix  /Rfam/rfam-family-pipeline/Rfam/Tests/data/rfamseq.test
    searchPathSuffix  .fa.gz
    revMate           revrfamseq
    haveTax           1
    updateDesc        1
  </rfamseq>
</seqdb>

<revseqdb>
  <revrfamseq>
    dbSize            500000.0
    searchPathPrefix  /Rfam/rfam-family-pipeline/Rfam/Tests/data/rev-rfamseq.test
    searchPathSuffix  .fa.gz
  </revrfamseq>
</revseqdb>

<Model>
  <Rfamlive>
    host            127.0.0.1
    port            3307
    database        rfam_test
    user            rfamro
    password        testpass
  </Rfamlive>
</Model>

<files>
    <annotation>
        DESC 1
    </annotation>
    family_file SEED
    family_file CM
    family_file TBLOUT
    family_file REVTBLOUT
    family_file SCORES
    family_file DESC
    excluded_file TBLOUT
    excluded_file TBLOUT
    timestamp_ordered_file SEED
    timestamp_ordered_file HMM
    timestamp_ordered_file OUTPUT
    timestamp_ordered_file DFAMOUT
    timestamp_ordered_file OUTPUT.rev
    timestamp_ordered_file DFAMOUT.rev
    timestamp_ordered_file scores
    timestamp_ordered_file ALIGN
    timestamp_ordered_file DESC
</files>

<curation>
  dictionary /tmp/dictionary
  <RNAcode>
    pvalue  0.05
  </RNAcode>
  <descTypes>
    <Gene>
      tRNA      1
      rRNA      1
      miRNA     1
      lncRNA    1
      sRNA      1
      <snRNA>
        splicing 1
        <snoRNA>
          CD-box   1
          HACA-box 1
          scaRNA   1
        </snoRNA>
      </snRNA>
    </Gene>
    <Cis-reg>
      IRES 1
      riboswitch         1
      thermoregulator    1
      frameshift_element 1
      leader             1
    </Cis-reg>
    Intron    1
  </descTypes>
  SOsuggestions "http://www.sequenceontology.org/cgi-bin/miso.cgi"
  GOsuggestions "http://www.geneontology.org/ or  http://www.ebi.ac.uk/QuickGO/"
  <overlap>
    RF00001
    RF00004
    RF00005
    RF00177
    RF00028
    RF00029
  </overlap>
  <ignorableQC>
    overlap 1
    spell   1
    coding  1
    seed    1
    missing 1
    length  1
    seedrf  1
  </ignorableQC>
</curation>

<view_sets>
  rfamseq Alignment
  rfamseq Species
  rfamseq SecondaryStructure
  rfamseq Tree
  genome Search
  genome Tree
  family HtmlAlignment
  family Species
  family Pseudoknots
  family SecondaryStructure
  family Tree
  family PDB
  family Motifs
  family Sunburst
</view_sets>

<view_process_job_dequeuer>
  polling_interval 2
  lock_dir         /tmp
  tmp_dir          /tmp
  tmp_space        100
</view_process_job_dequeuer>

binLocation  /opt/pixi/envs/infernal/bin/

RPlotScript  /Rfam/rfam-family-pipeline/dependencies/plot_outlist.R
Stockholm2ArcScript  /Rfam/rfam-family-pipeline/dependencies/Stockholm2Arc.R

productionPath /workdir/

ssImages /tmp/ss_images/
